[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolicana"
version = "0.1.0"
description = "Symbolic execution, path ranking, and path equivalence verification for binary-analysis benchmarks."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "angr==9.2.192",
  "claripy==9.2.192",
  "z3-solver==4.13.0.0",
  "bitstring>=4.1,<5",
  "pycparser>=2.21,<3",
  "cffi>=1.15,<2",
]

[project.scripts]
symbolicana = "symbolic_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
