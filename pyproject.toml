[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolicana"
version = "0.1.0"
description = "Symbolic execution, path ranking, and path equivalence verification for binary-analysis benchmarks."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "angr",
  "z3-solver",
]

[project.scripts]
symbolicana = "symbolic_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
